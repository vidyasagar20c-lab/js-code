<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>
    <form>
        <p><label>Heigth in CM:</label><input type="text" id="height"></p>
        <p><label>Heigth in KG:</label><input type="text" id="weight"></p>
        <button>Calculate</button>
    
    <div id="result"></div>
    <div id="weigth-guide">
        <h3>BMI Weigth Guide</h3>
        <p>Under Weight = Less then 18.6</p>
        <p>Under Range = 18.6 and 24.9</p>
        <p>Overweight = Greather than 24.9</p>
        </form>
    </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
